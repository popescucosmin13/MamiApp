<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Actualizare MamiApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf6f0;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 8px 40px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 16px;
      display: block;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e2a4a;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #667085;
      margin-bottom: 28px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      background: #c94b6a;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 18px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #667085;
      min-height: 20px;
      transition: color 0.2s;
    }

    .status.ok { color: #12b76a; font-weight: 600; }
    .status.err { color: #f04438; }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid #f0e0e8;
      border-top-color: #c94b6a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 16px auto 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🌸</span>
    <h1>Actualizare MamiApp</h1>
    <p>
      Se pare că aplicația nu s-a actualizat automat.<br>
      Apasă butonul de mai jos — ștergem versiunea veche și deschidem cea nouă.
    </p>

    <button class="btn" id="btn" onclick="resetPWA()">Actualizează acum</button>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    var done = false;

    function setStatus(msg, cls) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (cls ? ' ' + cls : '');
    }

    async function resetPWA() {
      if (done) return;
      done = true;

      var btn = document.getElementById('btn');
      var spinner = document.getElementById('spinner');
      btn.disabled = true;
      spinner.style.display = 'block';
      setStatus('Se curăță versiunea veche…');

      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var reg of regs) {
            await reg.unregister();
          }
        }

        if ('caches' in window) {
          var keys = await caches.keys();
          for (var key of keys) {
            await caches.delete(key);
          }
        }

        setStatus('Gata! Se deschide aplicația…', 'ok');

        setTimeout(function() {
          window.location.replace('/?v=' + Date.now());
        }, 800);

      } catch (e) {
        setStatus('Eroare: ' + e.message, 'err');
        btn.disabled = false;
        spinner.style.display = 'none';
        done = false;
      }
    }
  </script>
</body>
</html>
